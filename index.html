<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的小程式集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      background: linear-gradient(160deg, #2b1055, #7597de);
      color: #fff; min-height: 100vh; padding: 40px 20px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 {
      font-size: 34px; text-align: center; margin-bottom: 6px;
      text-shadow: 0 3px 12px rgba(0,0,0,.4);
    }
    .sub { text-align: center; opacity: .8; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; gap: 6px;
      background: rgba(255,255,255,.14); border-radius: 18px; padding: 20px;
      text-decoration: none; color: #fff; transition: transform .12s, background .2s;
      box-shadow: 0 4px 0 rgba(0,0,0,.2);
    }
    .card:hover { transform: translateY(-3px); background: rgba(255,255,255,.22); }
    .card .emoji { font-size: 40px; }
    .card .name { font-size: 19px; font-weight: 800; }
    .card .desc { font-size: 13px; opacity: .8; }
    .card.soon { opacity: .45; cursor: default; pointer-events: none; }
    footer { text-align: center; opacity: .6; font-size: 12px; margin-top: 36px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧩 我的小程式集</h1>
    <p class="sub">點選下方卡片開始</p>
    <div class="grid">
      <a class="card" href="sweet-crush/index.html">
        <span class="emoji">🍓</span>
        <span class="name">糖果繽紛樂</span>
        <span class="desc">單機三消遊戲 · 100 關</span>
      </a>
      <div class="card soon">
        <span class="emoji">➕</span>
        <span class="name">下一個程式</span>
        <span class="desc">敬請期待</span>
      </div>
    </div>
    <footer>Made with Claude Code</footer>
  </div>
</body>
</html>
